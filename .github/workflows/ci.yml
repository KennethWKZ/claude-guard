# Checks every push to main and every pull request; also weekly, so a new RustSec advisory for a locked dependency
# shows up without a code change.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, clippy, tests (macOS arm64)
    # The user-database calls are declared for macOS's struct layout, so tests run on macOS.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --locked

  supply-chain:
    name: cargo deny, cargo audit
    # Linux arm64: neither tool needs macOS, and this keeps the job out of the macOS runner queue (it once waited
    # there until its timeout while the release build and the test job held the macOS runners).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny (advisories, licences, duplicate crates, sources)
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
