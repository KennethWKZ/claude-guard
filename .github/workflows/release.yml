# Builds the macOS arm64 binary for a release, uploads it with its SHA-256, and records build provenance.
# Runs when a release is published, or by hand for an existing tag:
#   gh workflow run release.yml -R KennethWKZ/claude-guard -f tag=v0.1.0
# Check a download: gh attestation verify claude-guard-aarch64-apple-darwin.tar.gz -R KennethWKZ/claude-guard
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (vX.Y.Z)"
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the provenance
      attestations: write # store the provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ASSET: claude-guard-aarch64-apple-darwin.tar.gz
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac
          [ "$(uname -m)" = arm64 ] || { echo "runner is not arm64" >&2; exit 1; }

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          CLAUDE_GUARD_COMMIT="$(git rev-parse --short HEAD)" cargo build --release --locked
          target/release/claude-guard --version
          codesign --verify --verbose=1 target/release/claude-guard
          lipo -archs target/release/claude-guard

      - name: Package
        run: |
          tar -czf "$ASSET" -C target/release claude-guard
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET }}
            target/release/claude-guard

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"
