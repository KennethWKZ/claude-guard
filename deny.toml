# cargo deny check: run before each release (with cargo audit). Allows only the licences the dependencies use today;
# a new dependency with another licence, a second copy of a crate, or a source other than crates.io fails the check.

[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
# RustSec database, same as cargo audit; unmaintained and yanked crates fail too.
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unlicense", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
# claude-guard itself is unpublished (publish = false) and has no licence field.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
