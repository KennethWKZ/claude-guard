# cargo deny check: CI runs it on every push and pull request (with cargo audit). Allows only the licences in use today;
# a new dependency with another licence, a second copy of a crate, or a source other than crates.io fails the check.

[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
# RustSec database, same as cargo audit; unmaintained and yanked crates fail too.
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unlicense", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
