[package]
name = "claude-guard"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Fast guard hooks for Claude Code: Bash commands, file reads, prompts and URLs (one binary, one subcommand per hook)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/KennethWKZ/claude-guard"
readme = "README.md"
keywords = ["claude-code", "hooks", "security", "guardrails"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Hooks fail open or closed on purpose; catch_unwind needs unwinding, not abort.
panic = "unwind"
