[package]
name = "claude-guard"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Claude Code hooks in Rust, ported from Python and dash hooks (one binary, one subcommand per hook)."

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Hooks fail open or closed on purpose; catch_unwind needs unwinding, not abort.
panic = "unwind"
